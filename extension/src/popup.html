<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axiom Printer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0d9488;
      --accent-hover: #14b8a6;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(13, 148, 136, 0.6);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }

    .status-badge.online {
      background: rgba(13, 148, 136, 0.15);
      color: #2dd4bf;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* File Drop Zone */
    .file-zone {
      border: 1.5px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      background: rgba(255, 255, 255, 0.02);
    }

    .file-zone:hover {
      border-color: var(--accent);
      background: rgba(13, 148, 136, 0.04);
    }

    .file-zone-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .file-input {
      display: none;
    }

    /* Selected File Item */
    .file-item {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-sm);
    }

    .file-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .file-item-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-item-size {
      font-size: 10px;
      color: var(--text-muted);
    }

    .file-remove-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }

    .file-remove-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    /* Archive File Tabs */
    .archive-section {
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .archive-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .archive-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .archive-tab:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .archive-tab.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Controls Grid */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .select, .input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .select:focus, .input:focus {
      border-color: var(--accent);
    }

    .select option {
      background: var(--card-bg);
      color: var(--text);
    }

    /* Page Pills */
    .pills {
      display: flex;
      gap: 6px;
    }

    .pill {
      flex: 1;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .pill:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .pill.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Toggle Switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .toggle-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      transition: 0.2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    .switch input:checked + .slider {
      background: var(--accent);
    }

    .switch input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Preview Box */
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .btn-text {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-text:hover:not(:disabled) {
      background: rgba(13, 148, 136, 0.15);
      color: #2dd4bf;
    }

    .btn-text:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .preview-box {
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      min-height: 160px;
      max-height: 200px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .preview-placeholder {
      font-size: 12px;
      color: var(--text-muted);
    }

    .preview-embed {
      width: 100%;
      height: 160px;
      border: 0;
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 160px;
      object-fit: contain;
      display: none;
    }

    .preview-pre {
      width: 100%;
      max-height: 160px;
      overflow: auto;
      padding: 8px;
      font-size: 10px;
      font-family: monospace;
      color: #93c5fd;
      display: none;
      white-space: pre-wrap;
    }

    .pagination {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 6px 0 2px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      width: 22px;
      height: 22px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-counter {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Action Buttons */
    .action-row {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-primary {
      flex: 1.3;
      padding: 10px 14px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* Status Banner */
    .status-box {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
    }

    .status-box.show {
      display: flex;
    }

    .status-box.success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .status-box.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .status-box.loading {
      background: rgba(13, 148, 136, 0.15);
      color: #2dd4bf;
      border: 1px solid rgba(13, 148, 136, 0.25);
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Axiom</span>
    </div>
    <span class="status-badge" id="status-badge">Conectando...</span>
  </div>

  <!-- File Upload Card -->
  <div class="card">
    <div class="file-zone" id="file-zone">
      <span class="file-zone-text">Clique ou arraste um arquivo</span>
      <input type="file" id="file-input" class="file-input">
    </div>

    <div class="file-item" id="file-item">
      <div class="file-item-info">
        <span class="file-item-name" id="file-item-name">-</span>
        <span class="file-item-size" id="file-item-size">-</span>
      </div>
      <button type="button" class="file-remove-btn" id="file-remove-btn" title="Remover">&times;</button>
    </div>

    <!-- Archive Selector (if archive has multiple files) -->
    <div class="archive-section" id="archive-section">
      <span class="section-title">Arquivos no pacote</span>
      <div class="archive-tabs" id="archive-tabs"></div>
    </div>
  </div>

  <!-- Print Configuration Card -->
  <div class="card">
    <!-- Page Selection -->
    <div class="form-group" id="pages-form-group">
      <span class="form-label">Páginas</span>
      <div class="pills" id="page-pills">
        <button type="button" class="pill active" data-pages="all">Todas</button>
        <button type="button" class="pill" data-pages="1">Pág. 1</button>
        <button type="button" class="pill" data-pages="custom">Personalizado</button>
      </div>
      <input type="text" id="custom-pages-input" class="input" placeholder="Ex: 1-2, 4" style="display: none; margin-top: 4px;">
    </div>

    <!-- Printer Selection -->
    <div class="form-group">
      <span class="form-label">Impressora</span>
      <select id="printer-select" class="select" disabled>
        <option value="">Carregando...</option>
      </select>
    </div>

    <!-- Condense DANFE Toggle -->
    <div class="toggle-row">
      <span class="toggle-title">Condensar DANFE</span>
      <label class="switch" for="condense-toggle">
        <input type="checkbox" id="condense-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Preview Card -->
  <div class="card" style="padding: 10px;">
    <div class="preview-header">
      <span class="section-title">Pré-visualização</span>
      <button type="button" class="btn-text" id="refresh-preview-btn" disabled title="Renderiza a etiqueta no servidor">
        ↻ Atualizar prévia
      </button>
    </div>
    <div class="preview-box" id="preview-box">
      <span class="preview-placeholder" id="preview-placeholder">Pré-visualização</span>
      <embed class="preview-embed" id="preview-pdf" type="application/pdf">
      <img class="preview-img" id="preview-img" alt="Prévia">
      <pre class="preview-pre" id="preview-pre"></pre>
    </div>
    <div class="pagination" id="pdf-pagination">
      <button type="button" class="nav-btn" id="pdf-prev">&lsaquo;</button>
      <span class="page-counter" id="pdf-counter">1 / 1</span>
      <button type="button" class="nav-btn" id="pdf-next">&rsaquo;</button>
    </div>
  </div>

  <!-- Actions -->
  <div class="action-row">
    <button type="button" class="btn-secondary" id="preview-btn" disabled title="Renderizar prévia da etiqueta no servidor">
      ↻ Atualizar prévia
    </button>
    <button type="button" class="btn-primary" id="print-btn" disabled>Imprimir</button>
  </div>

  <!-- Status -->
  <div class="status-box" id="status-box">
    <span class="spinner" id="status-spinner"></span>
    <span id="status-text"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
